name: Publish to NPM

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")" || true

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get default branch
        id: get_branch
        run: |
          # Get the default branch from the repository
          DEFAULT_BRANCH=$(git remote show origin | grep "HEAD branch" | awk '{print $NF}')
          if [ -z "$DEFAULT_BRANCH" ]; then
            # Fallback: check which branch exists
            if git ls-remote --heads origin main | grep -q main; then
              DEFAULT_BRANCH="main"
            elif git ls-remote --heads origin master | grep -q master; then
              DEFAULT_BRANCH="master"
            else
              # Last resort: use the branch where workflow is running
              DEFAULT_BRANCH="${{ github.ref_name }}"
            fi
          fi
          echo "branch=${DEFAULT_BRANCH}" >> $GITHUB_OUTPUT
          echo "Using branch: ${DEFAULT_BRANCH}"

      - name: Create Git tag and push
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="${{ steps.get_branch.outputs.branch }}"
          echo "Pushing version ${VERSION} to branch: ${BRANCH}"
          git tag "v${VERSION}"
          git push origin ${BRANCH} --tags
          git push origin HEAD:${BRANCH}
