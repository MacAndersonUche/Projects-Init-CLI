name: Publish to NPM

on:
  push:
    branches: [master, main]
    paths:
      - 'package.json'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 required for trusted publishing (OIDC)
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")" || true

      - name: Check if version already published
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if npm view "projects-init-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already on npm — skipping publish"
            exit 0
          fi

          echo "already_published=false" >> "$GITHUB_OUTPUT"

          HIGHEST=$(npm view projects-init-cli versions --json | node -p "
            const v = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const list = (Array.isArray(v) ? v : [v]).filter(Boolean);
            list.sort((a, b) => {
              const pa = a.split('.').map(Number);
              const pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
              }
              return 0;
            });
            list.at(-1) || '';
          ")

          echo "highest_published=${HIGHEST}" >> "$GITHUB_OUTPUT"
          echo "Local version: ${VERSION}; highest on npm: ${HIGHEST:-none}"

          if [ -n "$HIGHEST" ]; then
            IS_LOWER=$(node -p "
              const a = '${VERSION}'.split('.').map(Number);
              const b = '${HIGHEST}'.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if ((a[i] || 0) < (b[i] || 0)) { console.log('true'); process.exit(0); }
                if ((a[i] || 0) > (b[i] || 0)) { console.log('false'); process.exit(0); }
              }
              console.log('false');
            ")
            if [ "$IS_LOWER" = "true" ]; then
              echo "::error::Cannot publish ${VERSION} as latest because ${HIGHEST} is already on npm. Bump package.json above ${HIGHEST}."
              exit 1
            fi
          fi

      - name: Publish to NPM
        if: steps.version_check.outputs.already_published != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          # setup-node writes always-auth + placeholder _authToken which break
          # npm 11 OIDC trusted publishing. Strip them before any publish attempt.
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            sed -i '/^always-auth/d' "$npmrc"
          fi

          published=false

          if [ -n "${NPM_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            if npm whoami >/dev/null 2>&1; then
              echo "Publishing with NPM_TOKEN as $(npm whoami)"
              echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$npmrc"
              npm publish --access public
              published=true
            else
              echo "NPM_TOKEN is set but invalid/expired (npm whoami failed)"
              unset NODE_AUTH_TOKEN
            fi
          fi

          if [ "$published" = false ]; then
            echo "Attempting trusted publishing via GitHub OIDC..."
            unset NODE_AUTH_TOKEN || true
            if ! npm publish --access public 2> >(tee /tmp/npm-publish.err >&2); then
              if grep -qE 'ENEEDAUTH|need auth|Unauthorized|401' /tmp/npm-publish.err; then
                echo "::error::npm publish auth failed. Configure ONE of the following, then re-run:"
                echo "1) Trusted Publisher: https://www.npmjs.com/package/projects-init-cli → Settings → Trusted Publisher"
                echo "   Repository: MacAndersonUche/Projects-Init-CLI"
                echo "   Workflow filename: publish-npm.yml"
                echo "2) Granular npm token with Read/Write on projects-init-cli as GitHub secret NPM_TOKEN"
              elif grep -q 'previously published version' /tmp/npm-publish.err; then
                echo "::error::Version is lower than an existing npm release. Bump package.json above the highest published version."
              else
                echo "::error::npm publish failed. See logs above."
              fi
              exit 1
            fi
          fi

      - name: Get default branch
        id: get_branch
        run: |
          DEFAULT_BRANCH=$(git remote show origin | grep "HEAD branch" | awk '{print $NF}')
          if [ -z "$DEFAULT_BRANCH" ]; then
            if git ls-remote --heads origin main | grep -q main; then
              DEFAULT_BRANCH="main"
            elif git ls-remote --heads origin master | grep -q master; then
              DEFAULT_BRANCH="master"
            else
              DEFAULT_BRANCH="${{ github.ref_name }}"
            fi
          fi
          echo "branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Using branch: ${DEFAULT_BRANCH}"

      - name: Create Git tag and push
        if: |
          steps.version_check.outputs.already_published != 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          BRANCH="${{ steps.get_branch.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Created and pushed tag v${VERSION}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Pushing version ${VERSION} to branch: ${BRANCH}"
            git push origin HEAD:"${BRANCH}"
          fi
