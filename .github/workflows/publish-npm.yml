name: Publish to NPM

on:
  push:
    branches: [master, main]
    paths:
      - 'package.json'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 required for trusted publishing (OIDC)
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")" || true

      - name: Check if version already published
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "projects-init-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already on npm — skipping publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not on npm — will publish"
          fi

      - name: Publish to NPM
        if: steps.version_check.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          if [ -n "${NODE_AUTH_TOKEN}" ] && npm whoami >/dev/null 2>&1; then
            echo "Authenticated with NPM_TOKEN as $(npm whoami)"
            npm publish --access public
          else
            echo "NPM_TOKEN missing/invalid — publishing via trusted publishing (OIDC)"
            if [ -f "$npmrc" ]; then
              # setup-node writes a placeholder _authToken that blocks OIDC
              sed -i '/_authToken/d' "$npmrc"
            fi
            unset NODE_AUTH_TOKEN
            npm publish --access public
          fi

      - name: Get default branch
        id: get_branch
        run: |
          DEFAULT_BRANCH=$(git remote show origin | grep "HEAD branch" | awk '{print $NF}')
          if [ -z "$DEFAULT_BRANCH" ]; then
            if git ls-remote --heads origin main | grep -q main; then
              DEFAULT_BRANCH="main"
            elif git ls-remote --heads origin master | grep -q master; then
              DEFAULT_BRANCH="master"
            else
              DEFAULT_BRANCH="${{ github.ref_name }}"
            fi
          fi
          echo "branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Using branch: ${DEFAULT_BRANCH}"

      - name: Create Git tag and push
        if: |
          steps.version_check.outputs.already_published != 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          BRANCH="${{ steps.get_branch.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Created and pushed tag v${VERSION}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Pushing version ${VERSION} to branch: ${BRANCH}"
            git push origin HEAD:"${BRANCH}"
          fi
